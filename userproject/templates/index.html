{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            text-align: center;
            padding: 40px;
            background: #1e293b;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 400px;
        }

        h1 {
            margin-bottom: 10px;
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background: #38bdf8;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #0ea5e9;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Welcome to My Django App 🚀</h1>
    <p>Please login to continue</p>

    <a href="/login/">Go to Login</a>
</div>

</body>
</html>
